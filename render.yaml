databases:
  - name: techcommerce-db
    plan: free
    databaseName: techcommerce
    user: techcommerce

services:
  - type: web
    name: techcommerce-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    # Alembic + seed ensure Render Postgres always has catalog + admin (admin@gmail.com/admin123)
    startCommand: alembic upgrade head || echo "alembic upgrade failed (continuing)"; python -m scripts.seed || echo "seed failed (continuing)"; gunicorn main:app -k uvicorn.workers.UvicornWorker --workers 2 --bind 0.0.0.0:$PORT --timeout 120 --graceful-timeout 30 --log-level info
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: DATABASE_URL
        fromDatabase:
          name: techcommerce-db
          property: connectionString
      - key: REDIS_URL
        sync: false
      - key: FRONTEND_URL
        value: https://techcommerce-frontend.techcommerce-frontend.workers.dev
      - key: CORS_EXTRA_ORIGINS
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: SENTRY_DSN
        sync: false
      - key: PYTHONUNBUFFERED
        value: "1"
